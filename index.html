<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="dynamic-island" class="dynamic-island hidden" title="Click to expand player mode">
    <div id="island-collapsed-content" class="island-collapsed-content">
      <img id="island-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Island Cover">
      <span id="island-title">Loading...</span>
      <div id="island-eq" class="eq-bars">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="island-hover-controls">
      <div class="island-track-meta">
        <img id="island-hover-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Cover">
        <div class="island-track-info">
          <div id="island-hover-title" class="island-track-title">Loading...</div>
          <div id="island-hover-artist" class="island-track-artist">Artist</div>
        </div>
      </div>
      <div class="island-btn-group">
        <button id="island-btn-prev" class="island-btn" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="island-btn-play" class="island-btn" title="Play/Pause">
          <svg id="island-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="island-btn-next" class="island-btn" title="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="player-card" class="player-card">
    <div class="glass-backdrop">
      <img id="backdrop-img" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Backdrop">
    </div>
    <div class="glass-overlay"></div>

    <canvas id="eq-canvas" class="eq-canvas"></canvas>

    <div class="player-content">
      <div id="cover-wrapper" class="cover-wrapper">
        <img id="cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Album Cover">
      </div>

      <div class="track-info">
        <h2 id="title" class="title">Loading...</h2>
        <p id="artist" class="artist">Please wait</p>
      </div>

      <div id="lyric-container" class="lyric-container">
        <p id="lyric-text" class="lyric-text">♪ Playing music...</p>
      </div>

      <div class="progress-section">
        <div id="progress-bar-bg" class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <div class="time-display">
          <span id="current-time">0:00</span>
          <span id="duration-time">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="btn-mode" class="control-btn spring-btn" title="Play Mode">
          <svg id="mode-icon" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>

        <button id="btn-prev" class="control-btn spring-btn" title="Previous Track">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button id="btn-play" class="control-btn btn-play spring-btn" title="Play/Pause">
          <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button id="btn-next" class="control-btn spring-btn" title="Next Track">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

        <button id="btn-drawer-toggle" class="control-btn spring-btn" title="Open Search & Utility Menu">
          <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        </button>
      </div>

      <div class="volume-container">
        <svg class="vol-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>

    <div id="utility-drawer" class="utility-drawer collapsed">
      <div class="drawer-header">
        <div class="drawer-tabs">
          <button id="tab-btn-search" class="drawer-tab active">Search</button>
          <button id="tab-btn-playlist" class="drawer-tab">Playlist</button>
          <button id="tab-btn-settings" class="drawer-tab">Settings</button>
        </div>
        <button id="btn-close-drawer" class="drawer-close-btn">&times;</button>
      </div>

      <div class="drawer-body">
        <div id="drawer-section-search" class="drawer-section active">
          <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search song or artist..." autocomplete="off">
            <button id="btn-search" class="btn-search-ios spring-btn" title="Search">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z"/></svg>
            </button>
          </div>
          <div id="search-results" class="search-results"></div>
        </div>

        <div id="drawer-section-playlist" class="drawer-section">
          <ul id="playlist-list" class="playlist-list"></ul>
        </div>

        <div id="drawer-section-settings" class="drawer-section">
          <div class="setting-item">
            <label for="glass-opacity">Glass Opacity</label>
            <input type="range" id="glass-opacity" min="0.1" max="0.9" step="0.05" value="0.5">
            <span id="glass-opacity-val">50%</span>
          </div>

          <div class="setting-item">
            <label for="tint-picker">Accent Tint</label>
            <input type="color" id="tint-picker" value="#ffffff">
          </div>

          <div class="setting-item">
            <label for="eq-toggle">Visualizer Equalizer</label>
            <input type="checkbox" id="eq-toggle" checked>
          </div>

          <div class="setting-item">
            <label for="island-toggle">Dynamic Island Pill</label>
            <button id="btn-toggle-island" class="setting-btn">Switch to Mini Pill</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player" crossorigin="anonymous"></audio>

  <script src="script.js"></script>
</body>
</html>
