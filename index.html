<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Glass Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="dynamic-island" class="dynamic-island hidden" title="Click anywhere on background to return to player mode">
    
    <div id="island-collapsed-content" class="island-collapsed-content">
      <img id="island-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Island Cover">
      
      <div class="island-collapsed-meta">
        <span id="island-title">Probably Up</span>
        <span class="island-meta-separator">•</span>
        <span id="island-artist">Lawrence</span>
      </div>

      <div id="island-eq" class="eq-bars">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="island-hover-controls">
      
      <div class="island-top-bar">
        <button id="island-btn-search" class="island-top-ctrl" title="Search">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
        <div class="island-top-right-group">
          <button id="island-btn-playlist" class="island-top-ctrl" title="Playlist">
            <svg viewBox="0 0 24 24"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
          </button>
          <button id="island-btn-settings" class="island-top-ctrl" title="Settings">
            <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1.0c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.03 2.18 13.82 2 13.6 2h-4c-.22 0-.43.18-.47.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1.0c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.0c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.47.42h4c.22 0 .43-.18.47-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1.0c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
          </button>
        </div>
      </div>

      <div class="island-track-meta">
        <img id="island-hover-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Cover">
        <div class="island-track-text">
          <span id="island-hover-title">Probably Up</span>
          <span id="island-hover-artist">Lawrence</span>
        </div>
      </div>

      <div id="island-marquee-container" class="island-marquee-container">
        <div id="island-marquee-inner" class="island-marquee-inner">
          <span id="island-lyric-text">Lyrics will scroll here...</span>
        </div>
      </div>

      <div class="island-progress-section">
        <div id="island-progress-bar-bg" class="progress-bar-bg">
          <div id="island-progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <div class="time-row">
          <span id="island-current-time">0:00</span>
          <span id="island-duration-time">0:00</span>
        </div>
      </div>

      <div class="island-action-buttons">
        <button id="island-btn-mode" class="island-ctrl-btn" title="Toggle Play Mode">
          <svg id="island-mode-loop" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          <svg id="island-mode-one" class="hidden" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zM12 10v4h1v-4h-1z"/></svg>
          <svg id="island-mode-shuffle" class="hidden" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button id="island-btn-prev" class="island-ctrl-btn" title="Previous Track">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="island-btn-play" class="island-ctrl-btn" title="Play/Pause">
          <svg id="island-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="island-pause-icon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="island-btn-next" class="island-ctrl-btn" title="Next Track">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="island-btn-lyrics" class="island-ctrl-btn active" title="Toggle Lyrics">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </button>
      </div>
    </div>

    <div id="island-search-drawer" class="playlist-drawer collapsed">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="font-size: 0.9rem; font-weight:600;">Search Track</h3>
        <button id="island-close-search" class="btn-exit-drawer"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <input type="text" id="island-search-input" placeholder="Type artist or song..." autocomplete="off" style="width:100%; padding:8px; border-radius:6px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,255,0.05); color:inherit; font-size:0.8rem;">
      <div id="island-search-predictions" class="search-predictions hidden"><ul id="island-predictions-ul"></ul></div>
      <div id="island-search-results" class="search-predictions hidden" style="position:relative; margin-top:8px;"><ul id="island-search-results-ul" style="list-style:none;"></ul></div>
    </div>

    <div id="island-playlist-drawer" class="playlist-drawer collapsed">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="font-size: 0.9rem; font-weight:600;">Playlist</h3>
        <button id="island-close-playlist" class="btn-exit-drawer"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <ul id="island-playlist-ul" style="list-style:none; overflow-y:auto; flex:1;"></ul>
    </div>

    <div id="island-settings-drawer" class="playlist-drawer collapsed">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="font-size: 0.9rem; font-weight:600;">Settings</h3>
        <button id="island-close-settings" class="btn-exit-drawer"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div style="font-size:0.75rem; margin-bottom:6px;">Volume</div>
      <input type="range" id="island-settings-vol" min="0" max="1" step="0.01" value="0.8" style="width:100%; margin-bottom:14px;">
      <div style="font-size:0.75rem; margin-bottom:6px;">Glass Opacity</div>
      <input type="range" id="island-settings-opacity" min="0" max="0.9" step="0.01" value="0.75" style="width:100%;">
    </div>

  </div>

  <div id="player-card" class="player-card">
    <div class="backdrop">
      <img id="backdrop-img" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Backdrop">
      <div class="backdrop-tint"></div>
    </div>

    <div class="player-content">
      <div class="top-bar">
        <button id="btn-island" class="btn-top" title="Switch to Dynamic Island Mode">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h10v2H7z"/></svg>
        </button>
        <div class="top-actions-right">
          <button id="btn-toggle-search" class="btn-top" title="Search Songs">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </div>
      </div>

      <div id="cover-wrapper" class="cover-wrapper">
        <img id="cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Cover Art">
      </div>

      <div class="track-info">
        <div class="title-row">
          <h2 id="title">Probably Up</h2>
          <div class="eq-bars">
            <span></span><span></span><span></span>
          </div>
        </div>
        <p id="artist">Lawrence</p>
      </div>

      <div class="progress-section">
        <div id="progress-bar-bg" class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <div class="time-row">
          <span id="current-time">0:00</span>
          <span id="duration-time">0:00</span>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player" crossorigin="anonymous"></audio>
  <script src="script.js"></script>
</body>
</html>
