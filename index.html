<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Glass Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="dynamic-island" class="dynamic-island hidden" title="Click anywhere on background to return to player mode">
    
    <div id="island-collapsed-content" class="island-collapsed-content">
      <img id="island-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Island Cover">
      
      <div class="island-collapsed-meta">
        <span id="island-title">Probably Up</span>
        <span class="island-meta-separator">•</span>
        <span id="island-artist">Lawrence</span>
      </div>

      <div id="island-eq" class="eq-bars">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="island-hover-controls">
      
      <div class="island-top-bar">
        <div class="island-track-meta-compact">
          <img id="island-hover-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Cover">
          <div class="island-track-text">
            <span id="island-hover-title">Probably Up</span>
            <span id="island-hover-artist">Lawrence</span>
          </div>
        </div>

        <div class="island-top-right-group">
          <button id="island-btn-search" class="island-top-ctrl" title="Search">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
          <button id="island-btn-playlist" class="island-top-ctrl" title="Playlist">
            <svg viewBox="0 0 24 24"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
          </button>
          <button id="island-btn-vol" class="island-top-ctrl" title="Volume Adjustment">
            <div class="vol-icon-wrapper">
              <svg id="island-vol-icon-svg" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
              <div id="vol-cross-strike" class="cross-strike hidden"></div>
            </div>
          </button>
          <button id="island-btn-opacity" class="island-top-ctrl" title="Glass Opacity">
            <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-1.09 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
          </button>
        </div>
      </div>

      <div id="island-marquee-container" class="island-marquee-container">
        <div id="island-marquee-inner" class="island-marquee-inner">
          <span id="island-lyric-text">Lyrics will scroll here...</span>
        </div>
      </div>

      <div class="island-progress-section">
        <div id="island-progress-bar-bg" class="progress-bar-bg">
          <div id="island-progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <div class="time-row">
          <span id="island-current-time">0:00</span>
          <span id="island-duration-time">0:00</span>
        </div>
      </div>

      <div class="island-action-buttons">
        <button id="island-btn-mode" class="island-ctrl-btn" title="Toggle Play Mode">
          <svg id="island-mode-loop" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          <svg id="island-mode-one" class="hidden" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zM12 10v4h1v-4h-1z"/></svg>
          <svg id="island-mode-shuffle" class="hidden" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button id="island-btn-prev" class="island-ctrl-btn" title="Previous Track">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="island-btn-play" class="island-ctrl-btn" title="Play/Pause">
          <svg id="island-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="island-pause-icon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="island-btn-next" class="island-ctrl-btn" title="Next Track">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="island-btn-lyrics" class="island-ctrl-btn active" title="Toggle Lyrics">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </button>
      </div>
    </div>

    <div id="island-search-drawer" class="playlist-drawer collapsed">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
        <h3 style="font-size: 0.65rem; font-weight:600;">Search Track</h3>
        <button id="island-close-search" class="btn-exit-drawer"><svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <input type="text" id="island-search-input" placeholder="Type artist or song..." autocomplete="off" style="width:100%; padding:2px 5px; border-radius:4px; border:1px solid rgba(0,0,0,0.15); background:rgba(0,0,0,0.03); color:inherit; font-size:0.6rem;">
      <div id="island-search-results" class="search-predictions hidden" style="position:relative; margin-top:2px; overflow-y:auto; max-height:130px;"><ul id="island-search-results-ul" style="list-style:none;"></ul></div>
    </div>

    <div id="island-playlist-drawer" class="playlist-drawer collapsed">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
        <h3 style="font-size: 0.65rem; font-weight:600;">Playlist</h3>
        <button id="island-close-playlist" class="btn-exit-drawer"><svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <ul id="island-playlist-ul" style="list-style:none; overflow-y:auto; flex:1;"></ul>
    </div>

    <div id="island-vol-popover" class="ios-popover collapsed">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1px; font-size:0.58rem;">
        <span style="font-weight:600;">Volume</span>
        <span id="island-vol-val" style="opacity:0.7;">80%</span>
      </div>
      <input type="range" id="island-settings-vol" class="ios-range" min="0" max="1" step="0.01" value="0.8">
    </div>

    <div id="island-opacity-popover" class="ios-popover collapsed">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1px; font-size:0.58rem;">
        <span style="font-weight:600;">Glass Opacity</span>
        <span id="island-opacity-val" style="opacity:0.7;">85%</span>
      </div>
      <input type="range" id="island-settings-opacity" class="ios-range" min="0" max="1" step="0.01" value="0.85">
    </div>

  </div>

  <audio id="audio-player" crossorigin="anonymous"></audio>
  <script src="script.js"></script>
</body>
</html>
