<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Glass Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="dynamic-island" class="dynamic-island hidden" title="Click anywhere on background to return to player mode">
    
    <div id="island-collapsed-content" class="island-collapsed-content">
      <img id="island-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Island Cover">
      
      <div class="island-collapsed-meta">
        <span id="island-title">Probably Up</span>
        <span class="island-meta-separator">•</span>
        <span id="island-artist">Lawrence</span>
      </div>

      <div id="island-eq" class="eq-bars">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="island-hover-controls">
      <div class="island-track-meta">
        <img id="island-hover-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Cover">
        <div class="island-track-info">
          <span id="island-hover-title" class="island-title-text">Probably Up</span>
          <span id="island-hover-artist" class="island-artist-text">Lawrence</span>
        </div>
      </div>
      <div class="island-controls">
        <button id="island-btn-prev" class="island-btn" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="island-btn-play" class="island-btn island-btn-play" title="Play/Pause">
          <svg id="island-play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="island-btn-next" class="island-btn" title="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="player-card" class="player-card">
    <div class="backdrop-blur">
      <img id="backdrop-img" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Backdrop">
    </div>

    <div class="card-content">
      <div class="top-bar">
        <button id="btn-island" class="icon-btn" title="Switch to Dynamic Island">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="top-bar-right">
          <button id="btn-toggle-search" class="icon-btn" title="Search Music">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button id="btn-toggle-playlist" class="icon-btn" title="Playlist">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button id="btn-toggle-info" class="icon-btn" title="Track Info">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </button>
        </div>
      </div>

      <div id="search-section" class="search-section collapsed">
        <input type="text" id="search-input" placeholder="Search track or artist...">
        <div id="search-results-container" class="search-results-container hidden">
          <ul id="search-results-ul"></ul>
        </div>
      </div>

      <div id="cover-wrapper" class="cover-wrapper">
        <img id="cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Cover">
      </div>

      <div class="track-info">
        <h2 id="title">Probably Up</h2>
        <p id="artist">Lawrence</p>
      </div>

      <div class="lyric-container">
        <p id="lyric-text">Loading lyrics...</p>
      </div>

      <div class="progress-section">
        <div id="progress-bar-bg" class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <div class="time-stamps">
          <span id="current-time">0:00</span>
          <span id="duration-time">0:00</span>
        </div>
      </div>

      <div class="controls-row">
        <button id="btn-mode" class="icon-btn mode-btn" title="Loop Mode">
          <svg id="mode-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
        <button id="btn-prev" class="icon-btn control-main" title="Previous">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btn-play" class="play-btn" title="Play">
          <svg id="play-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="btn-next" class="icon-btn control-main" title="Next">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="btn-volume" class="icon-btn" title="Volume">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02z"/></svg>
        </button>
      </div>

      <div id="volume-popover" class="volume-popover hidden">
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>

    <div id="playlist-drawer" class="playlist-drawer collapsed">
      <div class="ios-settings-header">
        <button id="btn-close-playlist" class="btn-exit-drawer" title="Close Playlist">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <h3>Playlist</h3>
      </div>
      <div class="playlist-scroll-area">
        <ul id="playlist-ul"></ul>
      </div>
    </div>

    <div id="info-drawer" class="info-drawer collapsed">
      <div class="ios-settings-header">
        <button id="btn-close-info" class="btn-exit-drawer" title="Close Track Info">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <h3>Track Information</h3>
      </div>
      
      <div class="ios-settings-group">
        <div class="ios-settings-title">Metadata</div>
        <div class="ios-settings-card">
          <div class="ios-row">
            <span class="ios-row-label">Album</span>
            <span id="meta-album" class="ios-row-value">Single</span>
          </div>
          <div class="ios-row">
            <span class="ios-row-label">Tempo</span>
            <span id="meta-bpm" class="ios-row-value">~120 BPM</span>
          </div>
          <div class="ios-row">
            <span class="ios-row-label">Release Year</span>
            <span id="meta-year" class="ios-row-value">2026</span>
          </div>
          <div class="ios-row">
            <span class="ios-row-label">Genre</span>
            <span id="meta-genre" class="ios-row-value">Pop / Acoustic</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <audio id="audio-player" crossorigin="anonymous"></audio>

  <script src="script.js"></script>
</body>
</html>
