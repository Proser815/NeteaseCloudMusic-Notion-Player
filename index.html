<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="dynamic-island" class="dynamic-island hidden" title="Click anywhere on background to return to player mode">
    <div id="island-collapsed-content" class="island-collapsed-content">
      <img id="island-cover" src="" alt="Island Cover">
      <span id="island-title">Loading...</span>
      <div id="island-eq" class="eq-bars">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="island-hover-controls">
      <div class="island-track-meta">
        <img id="island-hover-cover" src="" alt="Cover">
        <div class="island-track-info">
          <span id="island-hover-title">Loading...</span>
          <span id="island-hover-artist">Artist</span>
        </div>
      </div>

      <div class="island-center-cluster">
        <div id="island-lyric-text" class="island-lyric-text">Lyrics loading...</div>
        <div class="island-controls">
          <button id="island-btn-prev" class="island-ctrl-btn">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button id="island-btn-play" class="island-ctrl-btn main-play">
            <svg id="island-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="island-pause-icon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button id="island-btn-next" class="island-ctrl-btn">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>
      </div>

      <div class="island-right-controls">
        <input type="range" id="island-volume-slider" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>
  </div>

  <div id="player-card" class="player-card">
    <div class="backdrop-container">
      <img id="backdrop-img" src="" alt="Backdrop">
      <div class="backdrop-overlay"></div>
    </div>

    <div class="player-header">
      <div class="notch-indicator"></div>
    </div>

    <div class="player-body">
      <div class="cover-section">
        <div id="cover-wrapper" class="cover-wrapper">
          <img id="cover" src="" alt="Album Art">
          <canvas id="visualizer-canvas" class="visualizer-canvas"></canvas>
        </div>
      </div>

      <div class="meta-section">
        <h2 id="title">Loading...</h2>
        <p id="artist">Artist</p>
      </div>

      <div class="lyrics-section">
        <div id="lyric-container" class="lyric-container">
          <p id="lyric-text">Loading lyrics...</p>
        </div>
      </div>

      <div class="progress-section">
        <span id="current-time" class="time-label">0:00</span>
        <div id="progress-bar-bg" class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <span id="duration-time" class="time-label">0:00</span>
      </div>

      <div class="controls-section">
        <button id="btn-mode" class="btn-ctrl" title="Loop Mode">
          <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        </button>
        <button id="btn-prev" class="btn-ctrl">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btn-play" class="btn-ctrl main-play-btn">
          <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="btn-next" class="btn-ctrl">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="btn-search-toggle" class="btn-ctrl" title="Search Playlist">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </div>
    </div>

    <div class="bottom-action-bar">
      <button id="btn-list" class="btn-bottom" title="Playlist">
        <svg viewBox="0 0 24 24"><path d="M4 10h12v2H4zm0-4h16v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
      </button>

      <div class="hover-slider-container volume-hover-wrap">
        <button id="btn-volume" class="btn-bottom" title="Volume">
          <svg id="vol-low-icon" class="hidden" viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
          <svg id="vol-high-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="mute-icon" class="hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <div class="slider-popup">
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>

      <div class="hover-slider-container opacity-hover-wrap">
        <button id="btn-glass" class="btn-bottom" title="Opacity">
          <svg id="glass-icon" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 2.5c3.73 0 7.11 1.45 9.61 3.81L12 18.81 2.39 10.31C4.89 7.95 8.27 6.5 12 6.5z"/></svg>
        </button>
        <div class="slider-popup">
          <input type="range" id="opacity-slider" min="0.05" max="1" step="0.05" value="0.5">
        </div>
      </div>

      <button id="btn-lyrics" class="btn-bottom active" title="Toggle Lyrics View">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      </button>
      <button id="btn-island" class="btn-bottom" title="Dynamic Island Mode">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16z"/></svg>
      </button>
    </div>

    <div id="playlist-drawer" class="playlist-drawer collapsed">
      <div class="ios-settings-header">
        <h3>Playlist</h3>
        <button id="btn-close-playlist" class="btn-exit-drawer">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <div id="search-section" class="search-section collapsed">
        <div class="search-bar-wrap">
          <input type="text" id="search-input" placeholder="Search track or artist...">
          <button id="search-submit">Search</button>
        </div>
        <div id="search-results-container" class="search-results-container hidden">
          <ul id="search-results-ul"></ul>
        </div>
      </div>

      <div class="playlist-list-container">
        <ul id="playlist-ul"></ul>
      </div>
    </div>
  </div>

  <audio id="audio-player" crossorigin="anonymous"></audio>
  <script src="script.js"></script>
</body>
</html>
