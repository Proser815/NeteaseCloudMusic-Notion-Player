<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Music Player</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="blob-container">
    <div id="blob1" class="blob"></div>
    <div id="blob2" class="blob"></div>
    <div id="blob3" class="blob"></div>
  </div>

  <div class="player-card">
    <div class="song-info">
      <img id="albumCover" src="" alt="Album Cover" crossorigin="anonymous">
      <div class="details">
        <h2 id="songTitle">正在加载...</h2>
        <p id="artistName">请稍候</p>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-info">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button id="prevBtn"><i class="fas fa-step-backward"></i></button>
      <button id="playBtn" class="play-btn"><i class="fas fa-play"></i></button>
      <button id="nextBtn"><i class="fas fa-step-forward"></i></button>
    </div>

    <div class="volume-container">
      <i class="fas fa-volume-low"></i>
      <div class="volume-bar" id="volumeBar">
        <div class="volume-fill" id="volumeFill" style="width: 80%;"></div>
      </div>
      <i class="fas fa-volume-high"></i>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script src="script.js"></script>
</body>
</html>
