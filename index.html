<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Island Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <audio id="audio-player" crossorigin="anonymous"></audio>

  <div id="dynamic-island" class="dynamic-island">
    
    <div id="island-collapsed-content" class="island-collapsed-content">
      <img id="island-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Island Cover">
      <div class="island-collapsed-meta">
        <span id="island-title">Loading...</span>
        <span class="island-meta-separator">•</span>
        <span id="island-artist">...</span>
      </div>
      <div id="island-eq" class="eq-bars">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="island-hover-controls">
      
      <div class="island-top-bar">
        <div class="island-track-meta">
          <img id="island-hover-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Cover">
          <div class="island-track-text">
            <span id="island-hover-title">Loading...</span>
            <span id="island-hover-artist">...</span>
          </div>
        </div>

        <div class="island-top-actions">
          <button id="btn-toggle-search" class="island-icon-btn" title="Search">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
          <button id="btn-list" class="island-icon-btn" title="Playlist">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h11v2H4z"/></svg>
          </button>
          <button id="btn-info" class="island-icon-btn" title="Track Info">
            <svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
          </button>
          <button id="btn-lyrics" class="island-icon-btn" title="Lyrics">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </button>
        </div>
      </div>

      <div id="search-section" class="island-drawer collapsed">
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Search song or artist..." autocomplete="off">
          <button id="btn-search" class="island-icon-btn">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </div>
        <div id="search-predictions" class="search-predictions hidden">
          <ul id="predictions-ul"></ul>
        </div>
        <div id="search-results" class="search-results hidden">
          <ul id="search-results-ul"></ul>
        </div>
      </div>

      <div id="playlist-drawer" class="island-drawer collapsed">
        <div class="drawer-header">
          <span>Playlist</span>
          <button id="btn-close-playlist" class="btn-exit-drawer">✕</button>
        </div>
        <ul id="playlist-ul"></ul>
      </div>

      <div id="info-drawer" class="island-drawer collapsed">
        <div class="drawer-header">
          <span>Track Metadata</span>
          <button id="btn-close-info" class="btn-exit-drawer">✕</button>
        </div>
        <div class="info-details">
          <p><strong>Album:</strong> <span id="meta-album">Single</span></p>
          <p><strong>Tempo:</strong> <span id="meta-bpm">~120 BPM</span></p>
          <p><strong>Year:</strong> <span id="meta-year">2026</span></p>
          <p><strong>Genre:</strong> <span id="meta-genre">Pop / Acoustic</span></p>
          <p class="story-box"><strong>Story:</strong> <span id="meta-story">---</span></p>
        </div>
      </div>

      <div id="lyrics-container" class="island-drawer collapsed">
        <span id="lyric-text">Lyrics will appear here...</span>
      </div>

      <div class="island-marquee-container">
        <div id="island-marquee-inner" class="island-marquee-inner">
          <span id="island-lyric-text">Lyrics will scroll here...</span>
        </div>
      </div>

      <div class="island-progress-section">
        <span id="current-time">0:00</span>
        <div id="progress-bar-bg" class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <span id="duration-time">0:00</span>
      </div>

      <div class="island-action-buttons">
        <button id="island-btn-mode" class="island-ctrl-btn" title="Toggle Play Mode">
          <svg id="island-mode-loop" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          <svg id="island-mode-one" class="hidden" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zM12 10v4h1v-4h-1z"/></svg>
          <svg id="island-mode-shuffle" class="hidden" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>

        <button id="island-btn-prev" class="island-ctrl-btn" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button id="island-btn-play" class="island-ctrl-btn play-main" title="Play/Pause">
          <svg id="island-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="island-pause-icon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button id="island-btn-next" class="island-ctrl-btn" title="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

        <div class="island-volume-container">
          <button id="island-btn-volume" class="island-ctrl-btn" title="Mute/Unmute">
            <svg id="island-vol-low-icon" class="hidden" viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
            <svg id="island-vol-high-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="island-mute-icon" class="hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <input type="range" id="island-volume-slider" min="0" max="1" step="0.01" value="0.8">
        </div>

        <div class="island-glass-container">
          <button id="btn-glass" class="island-ctrl-btn" title="Toggle Glass Transparency">
            <svg id="glass-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            <svg id="glass-off-icon" class="hidden" viewBox="0 0 24 24"><path d="M12 4c4.41 0 8 3.59 8 8 0 1.83-.62 3.51-1.67 4.86l1.43 1.43C21.18 16.58 22 14.39 22 12c0-5.52-4.48-10-10-10-2.39 0-4.58.82-6.29 2.24l1.43 1.43C8.49 4.62 10.17 4 12 4z"/></svg>
          </button>
          <input type="range" id="opacity-slider" min="0" max="1" step="0.01" value="0.5">
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
