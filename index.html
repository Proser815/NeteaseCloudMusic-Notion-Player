<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iOS Dynamic Island Music Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="dynamic-island" class="dynamic-island hidden">
    <img id="pill-art" src="" alt="Album Art" />
    <span id="pill-title">Not Playing</span>
  </div>

  <div id="player-card" class="player-card">
    
    <div class="album-backdrop-container">
      <img id="backdrop-img" src="" alt="Backdrop" />
      <div class="backdrop-overlay"></div>
      <div class="blob-container">
        <div class="blob" id="blob1"></div>
        <div class="blob" id="blob2"></div>
      </div>
    </div>

    <div class="main-player">
      <div class="cover-wrapper" id="cover-wrapper" title="Click to shrink to Dynamic Island">
        <img id="album-art" src="" alt="Album Art" />
      </div>

      <div class="info-wrapper">
        <div class="track-details">
          <div class="title-row">
            <h2 id="song-title" class="title">Select a Song</h2>
            <div id="eq-bars" class="eq-bars hidden">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
          <p id="artist-name" class="artist">Artist</p>
        </div>

        <div id="lyrics-container" class="lyrics-container collapsed">
          <div id="marquee-wrapper" class="marquee-wrapper">
            <span id="lyric-text" class="lyric-text">No lyrics available</span>
          </div>
        </div>

        <div class="progress-container">
          <div id="progress-bar-bg" class="bar-bg">
            <div id="progress-bar-fill" class="bar-fill"></div>
          </div>
          <div class="time-display">
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button id="btn-info" class="btn-icon spring-btn" title="Song Info">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          </button>

          <button id="btn-lyrics" class="btn-icon spring-btn" title="Toggle Lyrics">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </button>

          <button id="btn-prev" class="btn-icon spring-btn" title="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>

          <button id="btn-play" class="btn-icon btn-play spring-btn" title="Play/Pause">
            <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>

          <button id="btn-next" class="btn-icon spring-btn" title="Next">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>

          <div class="volume-wrapper">
            <button id="btn-volume" class="btn-icon spring-btn" title="Volume">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            </button>
            <div class="volume-slider-container">
              <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" />
            </div>
          </div>

          <div class="glass-wrapper">
            <button id="btn-glass" class="btn-icon spring-btn" title="Glass Opacity">
              <svg viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            </button>
            <div class="glass-slider-container">
              <input type="range" id="opacity-slider" min="0" max="0.85" step="0.01" value="0.5" />
            </div>
          </div>

          <button id="btn-playlist" class="btn-icon spring-btn" title="Playlist Queue">
            <svg viewBox="0 0 24 24"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0l6 4-6 4v-8z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="info-drawer" class="info-drawer collapsed">
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Album</span>
          <span id="info-album" class="info-value">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">Release Year</span>
          <span id="info-year" class="info-value">-</span>
        </div>
      </div>
      <div class="info-story-container">
        <span class="info-label">About the Song</span>
        <p id="info-story" class="info-story-text">-</p>
      </div>
    </div>

    <div id="playlist-drawer" class="playlist-drawer collapsed">
      <div class="drawer-header">
        <span class="drawer-title">Playlist Queue</span>
        <div class="drawer-actions">
          <button id="btn-toggle-search" class="btn-icon spring-btn" title="Search Songs">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </div>
      </div>

      <div id="search-section" class="search-section collapsed">
        <div class="search-bar-wrapper">
          <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search song title or artist..." autocomplete="off" />
            <button id="btn-search-trigger" class="btn-search-ios spring-btn">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
          </div>

          <div id="search-predictions" class="search-predictions hidden">
            <ul id="predictions-ul"></ul>
          </div>
        </div>

        <div id="search-results" class="search-results hidden">
          <ul id="results-ul"></ul>
        </div>
      </div>

      <ul id="queue-ul"></ul>
    </div>

  </div>

  <audio id="audio-player"></audio>
  <script src="script.js"></script>
</body>
</html>
