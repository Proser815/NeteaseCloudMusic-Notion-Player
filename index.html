<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Glass Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="dynamic-island" class="dynamic-island hidden" title="Click anywhere on background to return to player mode">
    <div id="island-collapsed-content" class="island-collapsed-content">
      <img id="island-cover" src="" alt="Island Cover">
      <div class="island-collapsed-meta">
        <span id="island-title">Loading...</span>
        <span class="island-meta-separator">•</span>
        <span id="island-artist">Artist</span>
      </div>
      <div id="island-eq" class="eq-bars">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="island-hover-controls">
      <div class="island-track-meta">
        <img id="island-hover-cover" src="" alt="Cover">
        <div class="island-track-text">
          <span id="island-hover-title">Loading...</span>
          <span id="island-hover-artist">Artist</span>
        </div>
      </div>

      <div class="island-action-buttons">
        <button id="island-btn-mode" class="island-ctrl-btn" title="Toggle Play Mode">
          <svg id="island-mode-loop" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
        <button id="island-btn-prev" class="island-ctrl-btn" title="Previous Track">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="island-btn-play" class="island-ctrl-btn" title="Play/Pause">
          <svg id="island-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="island-pause-icon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="island-btn-next" class="island-ctrl-btn" title="Next Track">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

        <div class="island-volume-container hover-wrap">
          <button id="island-btn-volume" class="island-ctrl-btn" title="Mute/Unmute">
            <svg id="island-vol-low-icon" class="hidden" viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
            <svg id="island-vol-high-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="island-mute-icon" class="hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <div class="slider-popup">
            <input type="range" id="island-volume-slider" min="0" max="1" step="0.01" value="0.8">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="player-card" class="player-card">
    <div class="backdrop">
      <img id="backdrop-img" src="" alt="Backdrop">
      <div class="backdrop-tint"></div>
    </div>

    <div class="player-content">
      <div class="top-bar">
        <button id="btn-island" class="btn-top" title="Morph to Dynamic Island">
          <svg viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 4c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm10-4c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 4c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zM12 4c-4.42 0-8 3.58-8 8h2c0-3.31 2.69-6 6-6s6 2.69 6 6h2c0-4.42-3.58-8-8-8z"/></svg>
        </button>
        <div class="top-right-group">
          <button id="btn-toggle-search" class="btn-top" title="Search Songs">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
          <button id="btn-info" class="btn-top" title="Track Info">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          </button>
        </div>
      </div>

      <div id="search-section" class="search-section collapsed">
        <div class="search-bar-wrapper">
          <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search playlist (title, artist)..." autocomplete="off">
            <button id="btn-search" class="btn-search-ios">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
          </div>
          <div id="search-predictions" class="search-predictions hidden">
            <ul id="predictions-ul"></ul>
          </div>
        </div>
        <div id="search-results" class="search-results hidden">
          <ul id="search-results-ul"></ul>
        </div>
      </div>

      <div class="album-art-container">
        <div id="cover-wrapper" class="cover-wrapper">
          <img id="cover" src="" alt="Album Cover">
        </div>
      </div>

      <div class="track-info">
        <h2 id="title">Loading...</h2>
        <p id="artist">Please wait</p>
      </div>

      <div id="lyrics-container" class="lyrics-container">
        <div class="marquee-wrapper">
          <span id="lyric-text">Lyrics loading...</span>
        </div>
      </div>

      <div class="progress-section">
        <div id="progress-bar-bg" class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <div class="time-stamps">
          <span id="current-time">0:00</span>
          <span id="duration-time">0:00</span>
        </div>
      </div>

      <div class="controls-main">
        <button id="btn-mode" class="btn-ctrl" title="Play Mode">
          <svg id="mode-loop" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>

        <button id="btn-prev" class="btn-ctrl" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button id="btn-play" class="btn-ctrl btn-play-main" title="Play/Pause">
          <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button id="btn-next" class="btn-ctrl" title="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

        <button id="btn-lyrics" class="btn-ctrl" title="Toggle Lyrics Display">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </button>
      </div>

      <div class="bottom-action-bar">
        <button id="btn-list" class="btn-bottom" title="Playlist Drawer">
          <svg viewBox="0 0 24 24"><path d="M4 10h12v2H4zm0-4h16v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
        </button>

        <div class="volume-container hover-wrap">
          <button id="btn-volume" class="btn-bottom" title="Mute/Unmute">
            <svg id="vol-low-icon" class="hidden" viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
            <svg id="vol-high-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="mute-icon" class="hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <div class="slider-popup">
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
          </div>
        </div>

        <div class="glass-container hover-wrap">
          <button id="btn-glass" class="btn-bottom" title="Toggle Glass Opacity">
            <svg id="glass-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          </button>
          <div class="slider-popup">
            <input type="range" id="opacity-slider" min="0.1" max="0.9" step="0.05" value="0.5">
          </div>
        </div>
      </div>
    </div>

    <div id="playlist-drawer" class="playlist-drawer collapsed">
      <div class="ios-settings-header">
        <button id="btn-close-playlist" class="btn-exit-drawer" title="Close Playlist">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <h3>Playlist</h3>
      </div>
      <ul id="playlist-ul"></ul>
    </div>

    <div id="info-drawer" class="info-drawer collapsed">
      <div class="ios-settings-header">
        <button id="btn-close-info" class="btn-exit-drawer" title="Close Info">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <h3>Track Information</h3>
      </div>
      <div class="ios-settings-group">
        <div class="ios-settings-title">Metadata</div>
        <div class="ios-settings-card">
          <div class="ios-row"><span class="ios-row-label">Album</span><span id="meta-album" class="ios-row-value">Single</span></div>
          <div class="ios-row"><span class="ios-row-label">Tempo</span><span id="meta-bpm" class="ios-row-value">~120 BPM</span></div>
          <div class="ios-row"><span class="ios-row-label">Release Year</span><span id="meta-year" class="ios-row-value">2026</span></div>
          <div class="ios-row"><span class="ios-row-label">Genre</span><span id="meta-genre" class="ios-row-value">Pop / Acoustic</span></div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player" crossorigin="anonymous"></audio>
  <script src="script.js"></script>
</body>
</html>
