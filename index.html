<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="dynamic-island" class="dynamic-island hidden" title="Click anywhere on background to return to player mode">
    <div id="island-collapsed-content" class="island-collapsed-content">
      <img id="island-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Island Cover">
      <span id="island-title">Probably Up</span>
      <div id="island-eq" class="eq-bars">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="island-hover-controls">
      <div class="island-track-meta">
        <img id="island-hover-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Cover">
        <div class="island-track-text">
          <span id="island-hover-title">Probably Up</span>
          <span id="island-hover-artist">Lawrence</span>
        </div>
      </div>
      <div class="island-buttons">
        <button id="island-btn-prev" class="island-btn" title="Previous">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="island-btn-play" class="island-btn island-play-btn" title="Play/Pause">
          <svg id="island-play-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="island-btn-next" class="island-btn" title="Next">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div id="island-lyric-container">
        <span id="island-lyric-text">Lyrics loading...</span>
      </div>
    </div>
  </div>

  <div id="player-card" class="player-card">
    <div id="backdrop-container">
      <img id="backdrop-img" src="" alt="Backdrop">
    </div>

    <div class="glass-overlay"></div>

    <div class="top-bar">
      <button id="btn-island" class="icon-btn" title="Dynamic Island Mode">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
      </button>
      <div class="pill-status">
        <span class="status-dot"></span>
        <span class="status-text">Notion Player</span>
      </div>
      <button id="btn-toggle-search" class="icon-btn" title="Search Songs">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
    </div>

    <div id="search-section" class="search-section collapsed">
      <div class="search-bar-wrapper">
        <input type="text" id="search-input" placeholder="Search NetEase music...">
        <button id="search-btn" class="icon-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
      </div>
      <div id="search-results-container" class="search-results-container hidden">
        <ul id="search-results-ul"></ul>
      </div>
    </div>

    <div class="main-content">
      <div id="cover-wrapper" class="cover-wrapper">
        <img id="cover" src="" alt="Album Cover">
      </div>

      <div class="track-info">
        <div class="title-marquee">
          <h2 id="title">Loading...</h2>
        </div>
        <p id="artist">Artist</p>
      </div>

      <div class="lyrics-container">
        <div id="lyric-text" class="lyric-line">Enjoy the music</div>
      </div>

      <div class="progress-section">
        <div id="progress-bar-bg" class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <div class="time-info">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="btn-mode" class="control-btn secondary" title="Loop Mode">
          <svg id="mode-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <button id="btn-prev" class="control-btn" title="Previous">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btn-play" class="control-btn primary" title="Play/Pause">
          <svg id="play-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="btn-next" class="control-btn" title="Next">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="btn-playlist" class="control-btn secondary" title="Playlist">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div class="bottom-toolbar">
      <div class="volume-container">
        <button id="btn-mute" class="icon-btn sm" title="Mute">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
      </div>
      <div class="opacity-container">
        <span class="opacity-label">Glass</span>
        <input type="range" id="opacity-slider" min="0.1" max="0.9" step="0.05" value="0.5">
      </div>
    </div>

    <div id="playlist-drawer" class="playlist-drawer collapsed">
      <div class="ios-settings-header">
        <button id="btn-exit-playlist" class="btn-exit-drawer" title="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <h3>Playlist</h3>
      </div>
      <div class="playlist-list-container">
        <ul id="playlist-ul"></ul>
      </div>
    </div>
  </div>

  <audio id="audio-player" crossorigin="anonymous"></audio>
  <script src="script.js"></script>
</body>
</html>
