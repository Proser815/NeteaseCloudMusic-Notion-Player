<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="dynamic-island" class="dynamic-island hidden" title="Click anywhere on background to return to player mode">
    <div id="island-collapsed-content" class="island-collapsed-content">
      <img id="island-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Island Cover">
      <span id="island-title">Probably Up</span>
      <div id="island-eq" class="eq-bars">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="island-hover-controls">
      <div class="island-track-meta">
        <img id="island-hover-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Cover">
        <div class="island-track-texts">
          <div class="island-title-row">
            <span id="island-hover-title">Probably Up</span>
            <div class="eq-bars island-hover-eq">
              <span></span><span></span><span></span>
            </div>
          </div>
          <span id="island-hover-artist">Lawrence</span>
        </div>
      </div>

      <div class="island-lyrics-container" id="island-lyrics-container">
        <div class="island-marquee-wrapper">
          <span id="island-lyric-text" class="island-lyric-text"></span>
        </div>
      </div>
      
      <div class="island-buttons-row">
        <button id="island-btn-mode" class="island-ctrl-btn" title="Play Mode">
          <svg id="island-mode-loop" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          <svg id="island-mode-one" class="hidden" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-4V9h-1l-2 1v1h1.5v3H13z"/></svg>
          <svg id="island-mode-shuffle" class="hidden" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>

        <button id="island-btn-prev" class="island-ctrl-btn" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button id="island-btn-play" class="island-ctrl-btn island-play-main" title="Play/Pause">
          <svg id="island-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="island-pause-icon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button id="island-btn-next" class="island-ctrl-btn" title="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

        <div class="island-volume-wrapper" id="island-volume-wrapper">
          <button id="island-btn-volume" class="island-ctrl-btn" title="Volume">
            <svg id="island-vol-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="island-mute-icon" class="hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <div class="island-volume-slider-container" id="island-volume-slider-container">
            <input type="range" id="island-volume-slider" min="0" max="1" step="0.01" value="0.8">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="player-card" id="player-card">
    
    <div class="player-header">
      <span class="player-header-title">PLAYLIST QUEUE</span>
      <div class="header-actions">
        <button id="btn-settings-toggle" class="btn-icon spring-btn" title="Player Settings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>

      <div id="settings-menu" class="settings-menu collapsed">
        <button id="btn-lyrics" class="settings-item spring-btn" title="Toggle Lyrics">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <span>Lyrics</span>
        </button>

        <button id="btn-info" class="settings-item spring-btn" title="Toggle Song Details">
          <svg viewBox="0 0 24 24"><path d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>
          <span>Song Info</span>
        </button>

        <div class="settings-item slider-item">
          <svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg>
          <span>Opacity</span>
          <input type="range" id="opacity-slider" min="0" max="1" step="0.01" value="0.5">
        </div>

        <button id="btn-island" class="settings-item spring-btn" title="Toggle Dynamic Island">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
          <span>Island Mode</span>
        </button>
      </div>
    </div>

    <div class="album-backdrop-container">
      <img id="backdrop-img" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Backdrop">
      <div class="backdrop-overlay"></div>
      <div class="blob-container">
        <div class="blob" id="blob1"></div>
        <div class="blob" id="blob2"></div>
      </div>
    </div>

    <div class="main-player">
      <div id="cover-wrapper" class="cover-wrapper" title="Click to toggle Standby Mode">
        <img id="cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Album Cover">
      </div>
      <div class="info-wrapper">
        <div class="track-details">
          <div class="title-row">
            <span id="title" class="title">Probably Up</span>
          </div>
          <div class="artist-row">
            <span id="artist" class="artist">Lawrence</span>
            <div id="eq-bars" class="eq-bars">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>

        <div id="lyrics-container" class="lyrics-container">
          <div class="marquee-wrapper">
            <span id="lyric-text" class="lyric-text">Loading track lyrics...</span>
          </div>
        </div>

        <div class="progress-container">
          <span id="current-time" class="time">00:00</span>
          <div id="progress-bar-bg" class="progress-bar-wrapper">
            <div id="progress-bar-fill" class="progress-bar-fill"></div>
          </div>
          <span id="duration-time" class="time">00:00</span>
        </div>

        <div class="controls-container">
          <button id="btn-mode" class="btn-icon spring-btn" title="Loop Mode">
            <svg id="mode-loop" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <svg id="mode-one" class="hidden" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-4V9h-1l-2 1v1h1.5v3H13z"/></svg>
            <svg id="mode-shuffle" class="hidden" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>

          <button id="btn-prev" class="btn-icon spring-btn" title="Previous Song">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>

          <button id="btn-play" class="btn-icon play-main spring-btn" title="Play / Pause">
            <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <button id="btn-next" class="btn-icon spring-btn" title="Next Song">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>

          <div class="volume-wrapper">
            <button id="btn-volume" class="btn-icon spring-btn" title="Mute / Unmute">
              <svg id="vol-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg id="mute-icon" class="hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <div class="volume-slider-container">
              <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
            </div>
          </div>

          <button id="btn-list" class="btn-icon spring-btn" title="Playlist Queue">
            <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="info-drawer" class="info-drawer collapsed">
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Album</span>
          <span id="meta-album" class="info-value">--</span>
        </div>
        <div class="info-item">
          <span class="info-label">Tempo</span>
          <span id="meta-bpm" class="info-value">-- BPM</span>
        </div>
        <div class="info-item">
          <span class="info-label">Release</span>
          <span id="meta-year" class="info-value">--</span>
        </div>
        <div class="info-item">
          <span class="info-label">Genre</span>
          <span id="meta-genre" class="info-value">--</span>
        </div>
      </div>
      <div class="info-story-container">
        <span class="info-label">Track Context & Notes</span>
        <p id="meta-story" class="info-story-text">Loading track story...</p>
      </div>
    </div>

    <div id="playlist-drawer" class="playlist-drawer collapsed">
      <div id="search-section" class="search-section">
        <div class="search-bar-wrapper">
          <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search song or artist..." autocomplete="off">
            <button id="btn-search" class="btn-search-ios spring-btn" title="Search">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
          </div>
          <div id="search-predictions" class="search-predictions hidden">
            <ul id="predictions-ul"></ul>
          </div>
        </div>
      </div>

      <ul id="playlist-ul"></ul>
    </div>

  </div>

  <audio id="audio-player" crossorigin="anonymous"></audio>

  <script src="script.js"></script>
</body>
</html>
