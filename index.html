<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="dynamic-island" class="dynamic-island hidden" title="Click anywhere on background to return to player mode">
    <div id="island-collapsed-content" class="island-collapsed-content">
      <img id="island-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Island Cover">
      <span id="island-title">Loading...</span>
      <div id="island-eq" class="eq-bars">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="island-hover-controls">
      <div class="island-track-meta">
        <img id="island-hover-cover" src="https://p2.music.126.net/L3d8xO_09zW94sP7XhP23g==/109951163584824558.jpg" alt="Cover">
        <div class="island-track-texts">
          <div class="island-title-row">
            <span id="island-hover-title">Loading...</span>
            <div class="eq-bars island-hover-eq">
              <span></span><span></span><span></span>
            </div>
          </div>
          <span id="island-hover-artist">--</span>
        </div>
      </div>

      <div class="island-lyrics-container" id="island-lyrics-container">
        <div class="island-marquee-wrapper">
          <span id="island-lyric-text" class="island-lyric-text">♪ Music Playing ♪</span>
        </div>
      </div>
      
      <div class="island-buttons-row">
        <button id="island-btn-mode" class="island-ctrl-btn" title="Play Mode">
          <svg id="island-mode-loop" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          <svg id="island-mode-one" class="hidden" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-4V9h-1l-2 1v1h1.5v3H13z"/></svg>
          <svg id="island-mode-shuffle" class="hidden" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>

        <button id="island-btn-prev" class="island-ctrl-btn" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button id="island-btn-play" class="island-ctrl-btn island-btn-play-lg" title="Play/Pause">
          <svg id="island-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="island-pause-icon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button id="island-btn-next" class="island-ctrl-btn" title="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

        <div class="island-volume-wrapper">
          <button id="island-btn-volume" class="island-ctrl-btn" title="Volume">
            <svg id="island-vol-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="island-mute-icon" class="hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <input type="range" id="island-volume-slider" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </div>
  </div>

  <div class="player-card" id="player-card">
    <div class="backdrop-blur">
      <img id="backdrop-img" src="" alt="Backdrop">
      <div class="backdrop-overlay"></div>
      <div class="blob-container">
        <div class="blob" id="blob1"></div>
        <div class="blob" id="blob2"></div>
      </div>
    </div>

    <div class="player-header">
      <span class="player-header-title">Now Playing</span>
      <div class="tools-menu-wrapper">
        <button id="btn-tools-menu" class="btn-header-icon spring-btn" title="Player Tools">
          <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 017 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/></svg>
        </button>

        <div id="tools-dropdown" class="tools-dropdown hidden">
          <button id="btn-lyrics" class="tools-item">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <span>Live Lyrics</span>
          </button>
          <button id="btn-info" class="tools-item">
            <svg viewBox="0 0 24 24"><path d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>
            <span>Track Info</span>
          </button>
          <button id="btn-island" class="tools-item">
            <svg viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H5V8h14v10z"/></svg>
            <span>Mini Pill</span>
          </button>
        </div>
      </div>
    </div>

    <div class="cover-wrapper" id="cover-wrapper">
      <img id="cover" src="" alt="Album Cover">
    </div>

    <div class="track-info">
      <h2 id="title">Loading...</h2>
      <p id="artist">--</p>
    </div>

    <div class="lyrics-container collapsed" id="lyrics-container">
      <div id="lyrics-scroll-box" class="lyrics-scroll-box">
        <p id="lyric-text" class="lyric-text">Loading lyrics...</p>
      </div>
    </div>

    <div class="info-drawer collapsed" id="info-drawer">
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Album</span>
          <span id="meta-album" class="info-value">--</span>
        </div>
        <div class="info-item">
          <span class="info-label">BPM / Tempo</span>
          <span id="meta-bpm" class="info-value">--</span>
        </div>
        <div class="info-item">
          <span class="info-label">Release Year</span>
          <span id="meta-year" class="info-value">--</span>
        </div>
        <div class="info-item">
          <span class="info-label">Genre</span>
          <span id="meta-genre" class="info-value">--</span>
        </div>
      </div>
      <div class="info-story-container">
        <span class="info-label">Track Context & Notes</span>
        <p id="meta-story" class="info-story-text">Loading track story...</p>
      </div>
    </div>

    <div class="progress-container">
      <div class="bar-bg" id="progress-bar-bg">
        <div class="bar-fill" id="progress-bar-fill"></div>
      </div>
      <div class="time-display">
        <span id="current-time">00:00</span>
        <span id="duration-time">00:00</span>
      </div>
    </div>

    <div class="controls">
      <button id="btn-prev" class="btn-icon spring-btn" title="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button id="btn-play" class="btn-icon btn-play spring-btn" title="Play/Pause">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <button id="btn-next" class="btn-icon spring-btn" title="Next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="sub-controls">
      <button id="btn-mode" class="btn-sub-icon spring-btn" title="Play Mode">
        <svg id="mode-loop" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        <svg id="mode-one" class="hidden" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-4V9h-1l-2 1v1h1.5v3H13z"/></svg>
        <svg id="mode-shuffle" class="hidden" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>

      <div class="volume-wrapper">
        <button id="btn-volume" class="btn-sub-icon spring-btn" title="Volume">
          <svg id="vol-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="mute-icon" class="hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <div class="volume-slider-container">
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>

      <div class="glass-wrapper">
        <button id="btn-glass" class="btn-sub-icon spring-btn" title="Glass Tint">
          <svg id="glass-icon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.21 19.57 10.56 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
          <svg id="glass-off-icon" class="hidden" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31C15.55 19.37 13.85 20 12 20zm6.31-3.1L7.1 5.69C8.45 4.63 10.15 4 12 4c4.42 0 8 3.58 8 8 0 1.85-.63 3.55-1.69 4.9z"/></svg>
        </button>
        <div class="opacity-slider-container">
          <input type="range" id="opacity-slider" min="0" max="0.85" step="0.05" value="0.5">
        </div>
      </div>

      <button id="btn-list" class="btn-sub-icon spring-btn" title="Playlist & Search">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h11v2H4z"/></svg>
      </button>
    </div>

    <div id="playlist-drawer" class="playlist-drawer collapsed">
      <div class="drawer-header-actions">
        <button id="btn-toggle-search" class="btn-toggle-search spring-btn" title="Toggle Search">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z"/></svg>
        </button>
      </div>

      <div id="search-section" class="search-section collapsed">
        <div class="search-bar-wrapper">
          <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search song or artist..." autocomplete="off">
            <button id="btn-search" class="btn-search-ios spring-btn" title="Search">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z"/></svg>
            </button>
          </div>
          <div id="search-predictions" class="search-predictions hidden">
            <ul id="predictions-ul"></ul>
          </div>
        </div>

        <div id="search-results" class="search-results hidden">
          <span class="search-results-title">Search Results</span>
          <ul id="search-results-ul"></ul>
        </div>
      </div>

      <div class="playlist-scroll-container">
        <span class="playlist-title">Your Playlist</span>
        <ul id="playlist-ul"></ul>
      </div>
    </div>
  </div>

  <audio id="audio-player" crossorigin="anonymous"></audio>

  <script src="script.js"></script>
</body>
</html>
